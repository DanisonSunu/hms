{% extends "base.html" %}
{% block title %}New Appointment{% endblock %}{% block breadcrumb %}Appointments / New{% endblock %}
{% block content %}
<div class="page-header"><h2><i class="bi bi-calendar-plus me-2" style="color:#0d9488"></i>Schedule Appointment</h2></div>
<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-header py-3">Appointment Details</div>
<div class="card-body"><form method="POST"><div class="row g-3">
  <div class="col-12"><label class="form-label">Patient *</label>
    <select name="patient_id" class="form-select" required><option value="">Select Patient…</option>{% for p in patients %}<option value="{{ p.patient_id }}">{{ p.name }} (Age {{ p.age }})</option>{% endfor %}</select></div>
  <div class="col-12"><label class="form-label">Doctor *</label>
    <select name="doctor_id" class="form-select" required><option value="">Select Doctor…</option>{% for d in doctors %}<option value="{{ d.doctor_id }}">{{ d.name }} — {{ d.specialization }}</option>{% endfor %}</select></div>
  <div class="col-md-6"><label class="form-label">Date *</label><input type="date" name="date" class="form-control" required/></div>
  <div class="col-md-6"><label class="form-label">Time *</label><input type="time" name="time" class="form-control" required/></div>
  <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2" placeholder="Reason for visit…"></textarea></div>
</div><hr class="my-3"/>
<div class="d-flex gap-2"><button type="submit" class="btn btn-teal px-4"><i class="bi bi-check-lg me-1"></i>Book Appointment</button>
<a href="{{ url_for('appointments.list_appointments') }}" class="btn btn-outline-secondary">Cancel</a></div>
</form></div></div></div></div>
{% endblock %}
