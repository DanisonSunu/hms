{% extends "base.html" %}
{% block title %}Edit Doctor{% endblock %}{% block breadcrumb %}Doctors / Edit{% endblock %}
{% block content %}
<div class="page-header"><h2><i class="bi bi-pencil-square me-2" style="color:#0d9488"></i>Edit Doctor</h2></div>
<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-header py-3">Doctor Details</div>
<div class="card-body"><form method="POST"><div class="row g-3">
  <div class="col-12"><label class="form-label">Full Name *</label><input type="text" name="name" class="form-control" value="{{ doctor.name }}" required/></div>
  <div class="col-md-6"><label class="form-label">Specialization *</label><input type="text" name="specialization" class="form-control" value="{{ doctor.specialization }}" required/></div>
  <div class="col-md-6"><label class="form-label">Experience (Years)</label><input type="number" name="experience" class="form-control" value="{{ doctor.experience }}"/></div>
  <div class="col-md-6"><label class="form-label">Phone *</label><input type="tel" name="phone" class="form-control" value="{{ doctor.phone }}" required/></div>
  <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ doctor.email or '' }}"/></div>
  <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="available" id="av" {{ 'checked' if doctor.available }}/><label class="form-check-label" for="av">Currently Available</label></div></div>
</div><hr class="my-3"/>
<div class="d-flex gap-2"><button type="submit" class="btn btn-teal px-4">Save Changes</button>
<a href="{{ url_for('doctors.list_doctors') }}" class="btn btn-outline-secondary">Cancel</a></div>
</form></div></div></div></div>
{% endblock %}
