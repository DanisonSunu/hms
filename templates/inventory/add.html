{% extends "base.html" %}
{% block title %}Add Item{% endblock %}{% block breadcrumb %}Inventory / Add{% endblock %}
{% block content %}
<div class="page-header"><h2><i class="bi bi-box-seam me-2" style="color:#0d9488"></i>Add Inventory Item</h2></div>
<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-header py-3">Item Details</div>
<div class="card-body"><form method="POST"><div class="row g-3">
  <div class="col-12"><label class="form-label">Item Name *</label><input type="text" name="item_name" class="form-control" placeholder="e.g. Paracetamol 500mg" required/></div>
  <div class="col-md-6"><label class="form-label">Category</label>
    <select name="category" class="form-select"><option value="">Select…</option><option>Medicine</option><option>Equipment</option><option>Consumable</option></select></div>
  <div class="col-md-3"><label class="form-label">Quantity *</label><input type="number" name="quantity" class="form-control" min="0" required/></div>
  <div class="col-md-3"><label class="form-label">Unit</label><input type="text" name="unit" class="form-control" value="units"/></div>
  <div class="col-md-6"><label class="form-label">Unit Price (Rs.)</label><input type="number" name="unit_price" class="form-control" step="0.01" min="0" value="0"/></div>
  <div class="col-md-6"><label class="form-label">Supplier</label><input type="text" name="supplier" class="form-control"/></div>
</div><hr class="my-3"/>
<div class="d-flex gap-2"><button type="submit" class="btn btn-teal px-4"><i class="bi bi-check-lg me-1"></i>Add Item</button>
<a href="{{ url_for('inventory.list_inventory') }}" class="btn btn-outline-secondary">Cancel</a></div>
</form></div></div></div></div>
{% endblock %}
