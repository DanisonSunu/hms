{% extends "base.html" %}
{% block title %}Edit Record{% endblock %}{% block breadcrumb %}Records / Edit{% endblock %}
{% block content %}
<div class="page-header"><h2><i class="bi bi-pencil-square me-2" style="color:#0d9488"></i>Edit Record #{{ record.record_id }}</h2></div>
<div class="row justify-content-center"><div class="col-lg-8"><div class="card"><div class="card-header py-3">Record Details</div>
<div class="card-body"><form method="POST"><div class="row g-3">
  <div class="col-md-6"><label class="form-label">Patient *</label>
    <select name="patient_id" class="form-select" required>{% for p in patients %}<option value="{{ p.patient_id }}" {{ 'selected' if p.patient_id==record.patient_id }}>{{ p.name }}</option>{% endfor %}</select></div>
  <div class="col-md-6"><label class="form-label">Doctor *</label>
    <select name="doctor_id" class="form-select" required>{% for d in doctors %}<option value="{{ d.doctor_id }}" {{ 'selected' if d.doctor_id==record.doctor_id }}>{{ d.name }}</option>{% endfor %}</select></div>
  <div class="col-12"><label class="form-label">Diagnosis *</label><textarea name="diagnosis" class="form-control" rows="3" required>{{ record.diagnosis }}</textarea></div>
  <div class="col-12"><label class="form-label">Prescription</label><textarea name="prescription" class="form-control" rows="3">{{ record.prescription or '' }}</textarea></div>
  <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2">{{ record.notes or '' }}</textarea></div>
</div><hr class="my-3"/>
<div class="d-flex gap-2"><button type="submit" class="btn btn-teal px-4">Save Changes</button>
<a href="{{ url_for('records.view_record',record_id=record.record_id) }}" class="btn btn-outline-secondary">Cancel</a></div>
</form></div></div></div></div>
{% endblock %}
