<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    body{min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#0d9488 100%);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;}
    .login-card{background:#fff;border-radius:20px;box-shadow:0 25px 60px rgba(0,0,0,.35);overflow:hidden;width:420px;max-width:95vw;}
    .login-header{background:#0f172a;padding:2rem 2rem 1.5rem;text-align:center;}
    .login-logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#0d9488,#14b8a6);display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:.75rem;}
    .login-header h2{color:#fff;font-family:'Outfit',sans-serif;font-weight:800;font-size:1.5rem;margin:0;}
    .login-header p{color:#94a3b8;font-size:.8rem;margin:.2rem 0 0;}
    .login-body{padding:2rem;}
    .form-label{font-size:.8rem;font-weight:600;color:#374151;}
    .form-control{border-radius:10px;padding:.65rem 1rem;}
    .form-control:focus{border-color:#0d9488;box-shadow:0 0 0 3px rgba(13,148,136,.18);}
    .btn-login{background:linear-gradient(135deg,#0d9488,#14b8a6);color:#fff;border:none;border-radius:10px;padding:.75rem;font-weight:700;font-family:'Outfit',sans-serif;font-size:1rem;width:100%;transition:opacity .2s;}
    .btn-login:hover{opacity:.9;color:#fff;}
    .creds-hint{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:.7rem 1rem;font-size:.77rem;color:#166534;}
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div class="login-logo"><i class="bi bi-hospital" style="color:#fff"></i></div>
    <h2>Hospital Management</h2><p>Sign in to continue</p>
  </div>
  <div class="login-body">
    {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}
    <div class="alert alert-{{ category }} py-2 mb-3" style="font-size:.82rem">{{ message }}</div>
    {% endfor %}{% endif %}{% endwith %}
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus/>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required/>
        </div>
      </div>
      <button type="submit" class="btn-login"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
    </form>
    <div class="creds-hint mt-4">
      <strong><i class="bi bi-info-circle me-1"></i>Demo Credentials</strong>
      <div class="mt-1"><code>admin / admin123</code> &nbsp;·&nbsp; <code>doctor1 / doctor123</code> &nbsp;·&nbsp; <code>staff1 / staff123</code></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
