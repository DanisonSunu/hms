{% extends "base.html" %}
{% block title %}Register Patient{% endblock %}{% block breadcrumb %}Patients / Register{% endblock %}
{% block content %}
<div class="page-header"><h2><i class="bi bi-person-plus me-2" style="color:#0d9488"></i>Register New Patient</h2></div>
<div class="row justify-content-center"><div class="col-lg-8">
  <div class="card"><div class="card-header py-3">Patient Information</div>
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Full Name *</label><input type="text" name="name" class="form-control" required/></div>
        <div class="col-md-3"><label class="form-label">Age *</label><input type="number" name="age" class="form-control" min="0" required/></div>
        <div class="col-md-3"><label class="form-label">Gender *</label>
          <select name="gender" class="form-select" required><option value="">Select…</option><option>Male</option><option>Female</option><option>Other</option></select></div>
        <div class="col-md-6"><label class="form-label">Phone *</label><input type="tel" name="phone" class="form-control" required/></div>
        <div class="col-md-3"><label class="form-label">Blood Group</label>
          <select name="blood_group" class="form-select"><option value="">Unknown</option>
          {% for bg in ['A+','A-','B+','B-','O+','O-','AB+','AB-'] %}<option>{{ bg }}</option>{% endfor %}</select></div>
        <div class="col-12"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2"></textarea></div>
      </div>
      <hr class="my-3"/>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-teal px-4"><i class="bi bi-check-lg me-1"></i>Register</button>
        <a href="{{ url_for('patients.list_patients') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
