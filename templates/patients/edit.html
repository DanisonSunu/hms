{% extends "base.html" %}
{% block title %}Edit Patient{% endblock %}{% block breadcrumb %}Patients / Edit{% endblock %}
{% block content %}
<div class="page-header"><h2><i class="bi bi-pencil-square me-2" style="color:#0d9488"></i>Edit Patient</h2></div>
<div class="row justify-content-center"><div class="col-lg-8">
  <div class="card"><div class="card-header py-3">Patient Information</div>
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Full Name *</label><input type="text" name="name" class="form-control" value="{{ patient.name }}" required/></div>
        <div class="col-md-3"><label class="form-label">Age *</label><input type="number" name="age" class="form-control" value="{{ patient.age }}" required/></div>
        <div class="col-md-3"><label class="form-label">Gender *</label>
          <select name="gender" class="form-select" required>{% for g in ['Male','Female','Other'] %}<option {{ 'selected' if patient.gender==g }}>{{ g }}</option>{% endfor %}</select></div>
        <div class="col-md-6"><label class="form-label">Phone *</label><input type="tel" name="phone" class="form-control" value="{{ patient.phone }}" required/></div>
        <div class="col-md-3"><label class="form-label">Blood Group</label>
          <select name="blood_group" class="form-select"><option value="">Unknown</option>
          {% for bg in ['A+','A-','B+','B-','O+','O-','AB+','AB-'] %}<option {{ 'selected' if patient.blood_group==bg }}>{{ bg }}</option>{% endfor %}</select></div>
        <div class="col-12"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2">{{ patient.address or '' }}</textarea></div>
      </div>
      <hr class="my-3"/>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-teal px-4">Save Changes</button>
        <a href="{{ url_for('patients.view_patient',patient_id=patient.patient_id) }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
